[package]
name = "graph-kb"
version = "0.1.2"
description = "Graph-first local knowledge base — Phase 0"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "=1.0.5"
